<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFINITE DOWNLOADER</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <style>
        @keyframes loadingPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
    <div id="loading-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0B0F19; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: opacity 0.5s ease-out;">
        <i data-lucide="rocket" id="loading-rocket" style="width: 48px; height: 48px; margin-bottom: 20px; color: #3b82f6;"></i>
        <h2 style="margin: 0; font-size: 24px; letter-spacing: 2px;">INSTALLING DEPENDENCIES</h2>
        <p id="loading-text" style="color: #94a3b8; margin-top: 10px; font-size: 14px; text-align: center; max-width: 80%;">Preparing environment...</p>
    </div>
    
    <div id="auth-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(10px); z-index: 9998; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;">
        <div class="glass" style="padding: 40px; border-radius: 20px; width: 400px; max-width: 90%; display: flex; flex-direction: column; gap: 20px;">
            <div style="text-align: center; margin-bottom: 10px;">
                <i data-lucide="shield-check" style="width: 48px; height: 48px; color: #3b82f6;"></i>
                <h2 style="margin: 10px 0 5px 0;">BETA ACCESS</h2>
                <p style="color: #94a3b8; font-size: 14px; margin: 0;">Sign in to unlock Infinite Downloader</p>
            </div>
            
            <div id="auth-error" style="color: #ef4444; font-size: 13px; text-align: center; display: none;"></div>
            <div id="auth-msg" style="color: #10b981; font-size: 13px; text-align: center; display: none;"></div>
            
            <input type="email" id="auth-email" class="glass-input" placeholder="Email Address" style="width: 100%;">
            <input type="password" id="auth-pass" class="glass-input" placeholder="Password" style="width: 100%;">
            
            <button id="auth-login-btn" class="btn primary-btn neon-glow" style="width: 100%; padding: 12px; margin-top: 10px;">LOGIN</button>
            <button id="auth-signup-btn" class="btn glass-btn" style="width: 100%; padding: 12px;">CREATE ACCOUNT</button>
            <button id="auth-resend-btn" class="btn glass-btn" style="width: 100%; padding: 12px; display: none;">RESEND VERIFICATION EMAIL</button>
        </div>
    </div>
    
    <canvas id="bg-canvas"></canvas>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar glass">
            <div class="brand">
                <div class="logo"><i data-lucide="rocket"></i></div>
                <h2>INFINITE</h2>
            </div>
            <nav>
                <div class="nav-item active">
                    <span class="icon"><i data-lucide="download"></i></span>
                    <span>Downloads</span>
                </div>
                <div class="nav-item">
                    <span class="icon"><i data-lucide="settings"></i></span>
                    <span>Settings</span>
                </div>
            </nav>
            <div class="settings-panel">
                <div class="input-group">
                    <label>Quality</label>
                    <select id="qualitySelect" class="glass-input">
                        <option value="2160p">4K (2160p)</option>
                        <option value="1080p" selected>HD (1080p)</option>
                        <option value="720p">720p</option>
                        <option value="480p">480p</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Mode</label>
                    <select id="modeSelect" class="glass-input">
                        <option value="single" selected>Single Video</option>
                        <option value="playlist">Playlist</option>
                    </select>
                </div>
                <button id="folderBtn" class="btn glass-btn folder-btn" style="display: flex; align-items: center; justify-content: center; gap: 8px;"><i data-lucide="folder-open"></i> Choose Save Path</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-section glass">
                <div class="input-container">
                    <textarea id="urlInput" class="glass-input" placeholder="Paste YouTube URL here...&#10;[https://www.youtube.com/watch?v=...]"></textarea>
                    <button class="paste-btn" style="display: flex; align-items: center; justify-content: center;"><i data-lucide="clipboard-paste"></i></button>
                </div>
                <button id="addBtn" class="btn primary-btn neon-glow" style="display: flex; align-items: center; justify-content: center; gap: 8px;"><i data-lucide="plus"></i> ADD TO QUEUE</button>
            </div>

            <div class="queue-section">
                <div class="queue-header">
                    <h3>Download Queue</h3>
                    <span id="queueCount" class="badge">0</span>
                    <button id="stopBtn" class="btn danger-btn glass-btn" style="display: none;">STOP ALL</button>
                </div>
                
                <div id="queueList" class="queue-list">
                    <!-- Queue items will be generated here -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="animation.js"></script>
    <script type="module" src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
